name: upay_ver01
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 0.0.1+1

environment:
  sdk: '>=2.19.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.17.0
  english_words: ^4.0.0
  provider: ^6.0.0
  styled_text:
  spring_button: ^2.0.0
  countup: ^0.1.4
  flutter_animate: ^4.5.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^5.1.1
  riverpod: ^2.5.1
  http: ^1.2.1
  crypto: ^3.0.3
  pointycastle: ^3.9.1
  encrypt: ^5.0.3
  lottie: ^3.1.2
  audioplayers: ^6.0.0
  flutter_svg: ^2.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # ↓この部分を追加する↓
  assets:
    - images/
    - assets/sounds/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit/static/Outfit-Thin.ttf
          weight: 100
        - asset: assets/fonts/Outfit/static/Outfit-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Outfit/static/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit/static/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit/static/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit/static/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit/static/Outfit-Bold.ttf
          weight: 700
        - asset: assets/fonts/Outfit/static/Outfit-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Outfit/static/Outfit-Black.ttf
          weight: 900
          
flutter_intl:
  enabled: true
