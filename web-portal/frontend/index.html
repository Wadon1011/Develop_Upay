<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPortal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600&display=swap">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --bg:           #F4F7F9;
  --surface:      #FFFFFF;
  --surface-2:    #EDF0F3;
  --text:         #1B2030;
  --text-sub:     #6B7585;
  --accent:       #0CBF8A;
  --accent-deep:  #09A876;
  --accent-pale:  #E6FAF4;
  --warn:         #F59E0B;
  --warn-pale:    #FEF3C7;
  --danger:       #EF4444;
  --border:       #E2E7EC;
  --nav-h:        64px;
  --header-h:     56px;
  --shadow:       0 1px 3px rgba(27,32,48,.08), 0 4px 12px rgba(27,32,48,.06);
  --shadow-hover: 0 4px 8px rgba(27,32,48,.10), 0 12px 24px rgba(27,32,48,.10);
  --radius:       12px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:         #0F1219;
    --surface:    #1A1F2E;
    --surface-2:  #242A3A;
    --text:       #E6EBF2;
    --text-sub:   #8891A6;
    --accent-pale:#0D2E22;
    --warn-pale:  #2D1F06;
    --border:     #2A3045;
    --shadow:     0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
    --shadow-hover:0 4px 8px rgba(0,0,0,.35), 0 12px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg:         #0F1219;
  --surface:    #1A1F2E;
  --surface-2:  #242A3A;
  --text:       #E6EBF2;
  --text-sub:   #8891A6;
  --accent-pale:#0D2E22;
  --warn-pale:  #2D1F06;
  --border:     #2A3045;
  --shadow:     0 1px 3px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.25);
  --shadow-hover:0 4px 8px rgba(0,0,0,.35), 0 12px 24px rgba(0,0,0,.3);
}

/* ── Base ────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: 'Noto Sans JP', -apple-system, sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ── Header ──────────────────────────────────────────────── */
.header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--header-h);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 20px;
  justify-content: space-between;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  text-decoration: none;
}
.feature-badge {
  font-family: 'Outfit', sans-serif;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .3px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--accent-pale);
  color: var(--accent-deep);
  white-space: nowrap;
}
.logo-mark {
  width: 30px; height: 30px;
  background: var(--accent);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 14px;
  color: #fff;
  flex-shrink: 0;
}
.logo-text {
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 17px;
  color: var(--text);
  letter-spacing: -.3px;
}
.logo-text span { color: var(--accent); }
.header-title {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
}

/* ── Layout ──────────────────────────────────────────────── */
.panels {
  margin-top: var(--header-h);
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  min-height: calc(100vh - var(--header-h));
}
.panel { display: none; }
.panel.active { display: block; }

/* ── Bottom nav ──────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding-bottom: env(safe-area-inset-bottom, 0px);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: stretch;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  cursor: pointer;
  border: none;
  background: transparent;
  color: var(--text-sub);
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 10px;
  font-weight: 500;
  padding: 0;
  transition: color .15s;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn svg {
  width: 22px; height: 22px;
  stroke: currentColor;
  transition: stroke .15s;
}
.nav-btn.active {
  color: var(--accent);
}
.nav-btn:not(.active):active { color: var(--text); }

/* ── SHOP PANEL ──────────────────────────────────────────── */
.shop-inner {
  max-width: 1120px;
  margin: 0 auto;
  padding: 24px 16px 16px;
}
.page-title {
  font-family: 'Outfit', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.5px;
  margin: 0 0 4px;
  text-wrap: balance;
}
.page-desc {
  font-size: 12px;
  color: var(--text-sub);
  margin: 0 0 20px;
}

/* Filters */
.filters {
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-btn {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

.item-count {
  font-size: 12px;
  color: var(--text-sub);
  margin-bottom: 14px;
  font-family: 'Outfit', sans-serif;
  font-variant-numeric: tabular-nums;
}
.item-count strong { color: var(--text); font-weight: 600; }

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}

/* Card */
.card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: box-shadow .2s, transform .2s;
}
.card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }
.card-img-wrap {
  aspect-ratio: 1;
  overflow: hidden;
  background: var(--surface-2);
  position: relative;
  flex-shrink: 0;
}
.card-img {
  width: 100%; height: 100%;
  object-fit: contain;
  padding: 10px;
  transition: transform .3s;
}
.card:hover .card-img { transform: scale(1.05); }
.img-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  opacity: .3;
}

/* Badges on card image */
.cat-badge {
  position: absolute;
  top: 6px; left: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: 'Outfit', sans-serif;
  font-size: 9px;
  font-weight: 600;
  letter-spacing: .3px;
  text-transform: uppercase;
  backdrop-filter: blur(6px);
}
.cat-drink  { background: rgba(14,165,233,.15); color: #0EA5E9; }
.cat-snack  { background: rgba(168,85,247,.15);  color: #A855F7; }
.cat-food   { background: rgba(239,68,68,.15);   color: #EF4444; }
.cat-other  { background: rgba(107,114,128,.15); color: #6B7280; }

.stock-badge {
  position: absolute;
  top: 6px; right: 6px;
  padding: 2px 7px;
  border-radius: 999px;
  font-family: 'Outfit', sans-serif;
  font-size: 9px;
  font-weight: 600;
}
.stock-ok   { background: var(--accent-pale); color: var(--accent-deep); }
.stock-low  { background: var(--warn-pale);   color: #B45309; }
.stock-none { background: #FEE2E2;             color: var(--danger); }

.card-body {
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.card-name {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  margin-top: auto;
}
.card-price {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -.5px;
}
.card-price span {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-sub);
  margin-right: 1px;
}
.card-stock {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 500;
  color: var(--text-sub);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.card-stock.low  { color: var(--warn); }
.card-stock.none { color: var(--danger); font-weight: 600; }

/* Skeleton */
.skeleton-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
}
.skeleton-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.skeleton-img { aspect-ratio: 1; background: var(--surface-2); }
.skeleton-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; }
.skeleton-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
}
.skeleton-line.n1 { height: 12px; width: 80%; }
.skeleton-line.n2 { height: 12px; width: 55%; }
.skeleton-line.p  { height: 18px; width: 40%; margin-top: 4px; }
@keyframes shimmer {
  0%   { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* State (empty / error) */
.state {
  text-align: center;
  padding: 48px 24px;
  color: var(--text-sub);
  display: none;
}
.state.visible { display: block; }
.state-icon { font-size: 36px; display: block; margin-bottom: 10px; }
.state-title {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin: 0 0 5px;
}
.state-body {
  font-size: 12px;
  margin: 0 auto;
  max-width: 280px;
  line-height: 1.6;
}

/* ── BALANCE PANEL ───────────────────────────────────────── */
.balance-inner {
  max-width: 480px;
  margin: 0 auto;
  padding: 40px 24px 24px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}

/* Sign-in view */
.signin-card {
  width: 100%;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 32px 28px;
  text-align: center;
}
.signin-icon {
  width: 56px; height: 56px;
  background: var(--accent-pale);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}
.signin-icon svg {
  width: 28px; height: 28px;
  stroke: var(--accent);
}
.signin-title {
  font-family: 'Outfit', sans-serif;
  font-size: 18px;
  font-weight: 700;
  margin: 0 0 6px;
  letter-spacing: -.3px;
}
.signin-desc {
  font-size: 12px;
  color: var(--text-sub);
  margin: 0 0 24px;
  line-height: 1.6;
}
#signInDiv {
  display: flex;
  justify-content: center;
}

/* Balance display */
.balance-card {
  width: 100%;
  background: var(--accent);
  border-radius: 20px;
  padding: 28px 28px 24px;
  color: #fff;
  position: relative;
  overflow: hidden;
  display: none;
}
.balance-card::before {
  content: '';
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,.1);
}
.balance-card::after {
  content: '';
  position: absolute;
  bottom: -40px; right: 20px;
  width: 90px; height: 90px;
  border-radius: 50%;
  background: rgba(255,255,255,.07);
}
.balance-label {
  font-size: 12px;
  font-weight: 500;
  opacity: .85;
  margin: 0 0 8px;
  letter-spacing: .5px;
  text-transform: uppercase;
  font-family: 'Outfit', sans-serif;
}
.balance-amount {
  font-family: 'Outfit', sans-serif;
  font-size: 44px;
  font-weight: 700;
  letter-spacing: -1.5px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  margin: 0 0 16px;
}
.balance-amount .yen {
  font-size: 24px;
  font-weight: 600;
  opacity: .9;
  margin-right: 2px;
  vertical-align: middle;
}
.balance-user {
  font-size: 12px;
  opacity: .8;
  display: flex;
  align-items: center;
  gap: 6px;
}
.balance-user svg {
  width: 14px; height: 14px;
  stroke: currentColor;
  flex-shrink: 0;
}

.signout-btn {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-family: 'Outfit', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.signout-btn:hover { border-color: var(--danger); color: var(--danger); }
.signout-btn svg { width: 14px; height: 14px; stroke: currentColor; }

/* Status message */
#balStatus {
  width: 100%;
  padding: 14px 18px;
  border-radius: 10px;
  font-size: 13px;
  display: none;
  text-align: center;
}
#balStatus.info    { display: block; background: var(--accent-pale); color: var(--accent-deep); }
#balStatus.error   { display: block; background: #FEE2E2; color: #B91C1C; }

/* ── HISTORY ─────────────────────────────────────────────── */
.history-section {
  width: 100%;
}
.history-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}
.history-title {
  font-family: 'Outfit', sans-serif;
  font-size: 15px;
  font-weight: 700;
  margin: 0;
  color: var(--text);
}
.history-period {
  font-size: 11px;
  color: var(--text-sub);
}
.history-list {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.history-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
}
.history-row:last-child { border-bottom: none; }
.history-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}
.history-date {
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  color: var(--text-sub);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  min-width: 72px;
}
.history-main {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex: 1;
  gap: 8px;
  min-width: 0;
}
.history-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.history-amount {
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--danger);
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}
.history-amount.topup { color: var(--accent); }
.more-btn {
  width: 100%;
  margin-top: 10px;
  padding: 11px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--accent);
  font-family: 'Outfit', sans-serif;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.more-btn:hover { background: var(--accent-pale); border-color: var(--accent); }
.history-empty {
  text-align: center;
  padding: 20px;
  color: var(--text-sub);
  font-size: 13px;
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
}
.history-skel {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.history-skel-row {
  padding: 11px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--border);
}
.history-skel-row:last-child { border-bottom: none; }
.history-skel-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--surface-2); flex-shrink: 0; }
.history-skel-line {
  border-radius: 4px;
  background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s ease-in-out infinite;
  height: 11px;
}

/* ── QR CARD ─────────────────────────────────────────────── */
.qr-card {
  width: 100%;
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 24px 28px 22px;
  text-align: center;
  display: none;
}
.qr-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--text-sub);
  letter-spacing: .5px;
  text-transform: uppercase;
  font-family: 'Outfit', sans-serif;
  margin: 0 0 4px;
}
.qr-id {
  font-family: 'Outfit', sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  margin: 0 0 16px;
  color: var(--text);
}
.qr-box {
  display: inline-flex;
  padding: 12px;
  background: #fff;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.qr-box img, .qr-box canvas { display: block; }
.qr-note {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.6;
  margin: 14px 0 0;
}
.qr-countdown {
  font-size: 11px;
  color: var(--text-sub);
  margin: 6px 0 0;
  font-variant-numeric: tabular-nums;
  display: none;
}

/* ── CARD ACTIONS (リアクション・予約) ───────────────────────── */
.card-actions {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}
.reaction-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--text-sub);
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.reaction-btn:hover { border-color: var(--warn); color: #B45309; }
.reaction-btn.active {
  background: var(--warn-pale);
  border-color: var(--warn);
  color: #B45309;
}
.reaction-count { font-variant-numeric: tabular-nums; }
.reserve-btn {
  padding: 7px 10px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-family: 'Outfit', sans-serif;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
}
.reserve-btn:hover { background: var(--accent-deep); }
.reserve-btn.reserved {
  background: var(--surface-2);
  color: var(--text);
  border: 1.5px solid var(--border);
}

/* ── RESERVATION SECTION（アカウントタブ内）───────────────────── */
.reservation-section { width: 100%; display: none; }
.reservation-list {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.reservation-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
}
.reservation-row:last-child { border-bottom: none; }
.reservation-name {
  font-size: 13px;
  font-weight: 500;

}

<div class="toast" id="toast" hidden></div>

<script>
// ── 設定 ─────────────────────────────────────────────────────
const GOOGLE_CLIENT_ID = '605638314023-5rb9s3ukrkal634henma3trbnp17pfvq.apps.googleusercontent.com';
const GAS_WEB_APP_URL  = 'https://script.google.com/macros/s/AKfycby39pD_EP5AmbE9DLAzLnfzlD2bFd4Rhu38RJAa9LFMPxagT9jtm7SHZ02DqN5AlYQPaQ/exec';

const CAT_LABEL = { drink: 'ドリンク', snack: 'スナック', food: 'フード', other: 'その他' };
const CAT_CLASS = { drink: 'cat-drink', snack: 'cat-snack', food: 'cat-food',  other: 'cat-other' };
const CAT_EMOJI = { drink: '🥤', snack: '🍫', food: '🍜', other: '📦' };
const CATEGORY_ORDER = ['drink', 'snack', 'food', 'other'];

// 在庫あり優先 → カテゴリ順 → 価格の安い順
function compareItemsForDisplay(a, b) {
  const aInStock = Number(a.stock) > 0 ? 0 : 1;
  const bInStock = Number(b.stock) > 0 ? 0 : 1;
  if (aInStock !== bInStock) return aInStock - bInStock;

  const aCatIdx = CATEGORY_ORDER.indexOf((a.category || 'other').toLowerCase());
  const bCatIdx = CATEGORY_ORDER.indexOf((b.category || 'other').toLowerCase());
  const aCat = aCatIdx === -1 ? CATEGORY_ORDER.length : aCatIdx;
  const bCat = bCatIdx === -1 ? CATEGORY_ORDER.length : bCatIdx;
  if (aCat !== bCat) return aCat - bCat;

  return Number(a.price) - Number(b.price);
}

// ── State ────────────────────────────────────────────────────
let allItems = [];
let activeCategory = 'all';
let signedInEmail = null;
let currentIdToken = null;
let myReservationsList = [];
let myReservationsByItemId = {};

// ── トースト通知 ──────────────────────────────────────────────
let toastTimerId = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimerId);
  toastTimerId = setTimeout(() => { el.hidden = true; }, 3500);
}

// ── Tab switching ────────────────────────────────────────────
const TABS = {
  shop:    { panel: 'panelShop',    nav: 'navShop',    title: '商品一覧' },
  balance: { panel: 'panelBalance', nav: 'navBalance', title: 'アカウント' },
};

function switchTab(tab) {
  Object.entries(TABS).forEach(([key, cfg]) => {
    document.getElementById(cfg.panel).classList.toggle('active', key === tab);
    document.getElementById(cfg.nav).classList.toggle('active', key === tab);
  });
  document.getElementById('headerTitle').textContent = TABS[tab].title;
}

// ── SHOP ─────────────────────────────────────────────────────
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeCategory = btn.dataset.cat;
  renderGrid();
});

function escHtml(str) {
  return String(str ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 補充希望リアクション（ログイン不要・端末ごとにON/OFFを記憶） ──────
function hasReacted(itemId) {
  try { return localStorage.getItem('upay_reacted_' + itemId) === '1'; } catch { return false; }
}
function setReacted(itemId, reacted) {
  try {
    if (reacted) localStorage.setItem('upay_reacted_' + itemId, '1');
    else localStorage.removeItem('upay_reacted_' + itemId);
  } catch { /* localStorageが使えない環境では単に記憶されない */ }
}

async function handleReactionClick(itemId) {
  const add = !hasReacted(itemId);
  setReacted(itemId, add);
  renderGrid(); // 楽観的にUIを更新
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'toggleRestockReaction', itemId, add }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');
    const item = allItems.find(it => String(it.id) === String(itemId));
    if (item) item.reactionCount = data.count;
    renderGrid();
  } catch (err) {
    setReacted(itemId, !add); // 失敗したら元に戻す
    renderGrid();
    showToast('リアクションの送信に失敗しました: ' + err.message);
  }
}

// ── 在庫予約 ─────────────────────────────────────────────────
async function handleReserveClick(itemId) {
  if (!currentIdToken) {
    showToast('予約にはサインインが必要です。アカウントタブからサインインしてください。');
    switchTab('balance');
    return;
  }
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken: currentIdToken, action: 'reserveItem', itemId }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');
    showToast('在庫をキープしました。2時間以内にレジでお受け取りください。');
    await Promise.all([reloadItems(), fetchMyReservations()]);
  } catch (err) {
    showToast('予約に失敗しました: ' + err.message);
  }
}

async function handleCancelReservation(reservationId) {
  if (!currentIdToken) return;
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken: currentIdToken, action: 'cancelReservation', reservationId }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');
    showToast('予約を取り消しました。');
    await Promise.all([reloadItems(), fetchMyReservations()]);
  } catch (err) {
    showToast('取り消しに失敗しました: ' + err.message);
  }
}

function buildCard(item) {
  const cat = (item.category || 'other').toLowerCase();
  const stock = Number(item.stock);
  let stockClass, stockLabel, badgeClass, badgeLabel;
  if (stock <= 0) {
    stockClass = 'none'; stockLabel = '在庫なし';
    badgeClass = 'stock-none'; badgeLabel = '在庫切れ';
  } else if (stock <= 5) {
    stockClass = 'low'; stockLabel = `残り${stock}`;
    badgeClass = 'stock-low'; badgeLabel = '残り少ない';
  } else {
    stockClass = ''; stockLabel = `在庫 ${stock}`;
    badgeClass = 'stock-ok'; badgeLabel = `${stock}`;
  }

  const itemIdStr = String(item.id);
  const reacted = hasReacted(itemIdStr);
  const reactionCount = Number(item.reactionCount) || 0;

  const myReservation = myReservationsByItemId[itemIdStr];
  let reserveBtnHtml = '';
  if (myReservation) {
    reserveBtnHtml = `<button class="reserve-btn reserved" onclick="handleCancelReservation('${escHtml(myReservation.reservationId)}')">予約中・取り消す</button>`;
  } else if (stock >= 1) {
    reserveBtnHtml = `<button class="reserve-btn" onclick="handleReserveClick('${escHtml(itemIdStr)}')">在庫をキープ（2時間）</button>`;
  }

  const card = document.createElement('article');
  card.className = 'card';
  card.innerHTML = `
    <div class="card-img-wrap">
      <img class="card-img" src="${escHtml(item.image)}" alt="${escHtml(item.name)}" loading="lazy"
        onerror="this.style.display='none';this.parentElement.insertAdjacentHTML('beforeend','<div class=\\'img-placeholder\\'>${CAT_EMOJI[cat]||'📦'}</div>')" >
      <span class="cat-badge ${CAT_CLASS[cat]||'cat-other'}">${escHtml(CAT_LABEL[cat]||cat)}</span>
      <span class="stock-badge ${badgeClass}">${badgeLabel}</span>
    </div>
    <div class="card-body">
      <div class="card-name">${escHtml(item.name)}</div>
      <div class="card-footer">
        <div class="card-price"><span>¥</span>${Number(item.price).toLocaleString()}</div>
        <div class="card-stock ${stockClass}">${stockLabel}</div>
      </div>
      <div class="card-actions">
        <button class="reaction-btn ${reacted ? 'active' : ''}" onclick="handleReactionClick('${escHtml(itemIdStr)}')">
          📦 補充希望<span class="reaction-count">${reactionCount > 0 ? ' ' + reactionCount : ''}</span>
        </button>
        ${reserveBtnHtml}
      </div>
    </div>`;
  return card;
}

function renderGrid() {
  const grid        = document.getElementById('grid');
  const emptyState  = document.getElementById('emptyState');
  const itemCount   = document.getElementById('itemCount');

  const filtered = activeCategory === 'all'
    ? allItems
    : allItems.filter(it => (it.category || '').toLowerCase() === activeCategory);

  grid.innerHTML = '';
  if (filtered.length === 0) {
    grid.hidden = true;
    emptyState.classList.add('visible');
    itemCount.hidden = true;
  } else {
    emptyState.classList.remove('visible');
    grid.hidden = false;
    filtered.forEach(item => grid.appendChild(buildCard(item)));
    itemCount.innerHTML = '';
    const s = document.createElement('strong');
    s.textContent = filtered.length;
    itemCount.appendChild(s);
    itemCount.appendChild(document.createTextNode(' 件'));
    itemCount.hidden = false;
  }
}

async function loadItems() {
  try {
    const res = await fetch(GAS_WEB_APP_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');
    return data.items;
  } catch (err) {
    throw err;
  }
}

// 予約・リアクションの操作後に、在庫数やカウントを最新化するための再取得
async function reloadItems() {
  try {
    allItems = await loadItems();
    allItems.sort(compareItemsForDisplay);
    renderGrid();
  } catch (err) {
    showToast('商品情報の再取得に失敗しました: ' + err.message);
  }
}

(async () => {
  const loading = document.getElementById('shopLoading');
  const errState = document.getElementById('shopErrorState');
  const errMsg   = document.getElementById('shopErrorMsg');
  try {
    allItems = await loadItems();
    allItems.sort(compareItemsForDisplay);
    loading.style.display = 'none';
    renderGrid();
  } catch (err) {
    loading.style.display = 'none';
    errMsg.textContent = err.message || 'データ取得中にエラーが発生しました。';
    errState.classList.add('visible');
  }
})();

// ── 予約一覧（アカウントタブ） ─────────────────────────────────
async function fetchMyReservations() {
  if (!currentIdToken) {
    myReservationsList = [];
    myReservationsByItemId = {};
    renderMyReservations();
    return;
  }
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken: currentIdToken, action: 'myReservations' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');
    myReservationsList = data.reservations || [];
    myReservationsByItemId = {};
    myReservationsList.forEach(r => { myReservationsByItemId[String(r.itemId)] = r; });
    renderMyReservations();
    renderGrid();
  } catch (err) {
    console.error('[UPay] 予約情報の取得に失敗:', err);
  }
}

function renderMyReservations() {
  const section = document.getElementById('reservationSection');
  const list    = document.getElementById('reservationList');
  const empty   = document.getElementById('reservationEmpty');

  if (!currentIdToken) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';

  if (myReservationsList.length === 0) {
    list.hidden = true;
    empty.hidden = false;
    return;
  }
  empty.hidden = true;
  list.hidden = false;
  list.innerHTML = '';
  myReservationsList.forEach(r => list.appendChild(buildReservationRow(r)));
}

function buildReservationRow(r) {
  const remainMs = Math.max(0, new Date(r.expiresAt).getTime() - Date.now());
  const mins = Math.floor(remainMs / 60000);
  const secs = Math.floor((remainMs % 60000) / 1000);

  const row = document.createElement('div');
  row.className = 'reservation-row';
  row.innerHTML = `
    <div>
      <div class="reservation-name">${escHtml(r.itemName)}</div>
      <div class="reservation-timer">あと ${mins}分${String(secs).padStart(2, '0')}秒でキャンセル</div>
    </div>
    <button class="reservation-cancel-btn" onclick="handleCancelReservation('${escHtml(r.reservationId)}')">取り消す</button>`;
  return row;
}

// 1秒ごとにカウントダウン表示を更新し、期限切れの予約はローカルでも取り除く
setInterval(() => {
  if (myReservationsList.length === 0) return;
  const now = Date.now();
  const before = myReservationsList.length;
  myReservationsList = myReservationsList.filter(r => new Date(r.expiresAt).getTime() > now);
  if (myReservationsList.length !== before) {
    myReservationsByItemId = {};
    myReservationsList.forEach(r => { myReservationsByItemId[String(r.itemId)] = r; });
    renderGrid();
  }
  renderMyReservations();
}, 1000);

// 他端末での予約操作などとズレないよう、定期的にサーバーへ問い合わせ直す
setInterval(() => { if (currentIdToken) fetchMyReservations(); }, 60000);

// ── BALANCE ──────────────────────────────────────────────────
function showBalStatus(msg, type) {
  const el = document.getElementById('balStatus');
  el.textContent = msg;
  el.className = type;
}

function showBalanceCard(balance, email, data) {
  document.getElementById('balanceCard').style.display = 'block';
  document.getElementById('balanceNum').textContent = Number(balance).toLocaleString();
  document.getElementById('balanceEmail').textContent = email;
  document.getElementById('signinCard').style.display = 'none';
  document.getElementById('signoutBtn').style.display = 'flex';
  document.getElementById('balStatus').className = '';
  renderQr(data);
}

// ── QRコード ─────────────────────────────────────────────────
// QRコードには生のUserIDを載せず、その都度サーバー(GAS)が発行する
// 短命・使い捨てのトークンを載せる。有効期限が近づくと自動的に新しいトークンを取得して再描画する。
let qrRefreshTimerId = null;
let qrCountdownTimerId = null;
let qrTokenExpiresAt = 0;

function renderQr(data) {
  const card      = document.getElementById('qrCard');
  const box       = document.getElementById('qrBox');
  const idEl      = document.getElementById('qrId');
  const note      = document.getElementById('qrNote');
  const countdown = document.getElementById('qrCountdown');

  stopQrRefresh();
  box.innerHTML = '';
  card.style.display = 'block';

  const userId = data ? data.userId : undefined;
  const columnFound = !data || data.userIdColumnFound !== false; // 旧バックエンド互換: キーが無ければ true 扱い

  if (!columnFound) {
    idEl.textContent = '—';
    box.style.display = 'none';
    countdown.style.display = 'none';
    note.textContent = 'スプレッドシートに「UserID」列が見つかりません。UserData シートのヘッダー行を確認してください。';
    return;
  }

  if (userId === undefined || userId === null || String(userId).trim() === '') {
    idEl.textContent = '—';
    box.style.display = 'none';
    countdown.style.display = 'none';
    note.textContent = 'あなたの行の UserID が空です。GAS を最新版に再デプロイ済みか、該当行に UserID が入力されているか確認してください。';
    return;
  }

  idEl.textContent = String(userId).trim();
  box.style.display = 'inline-flex';
  note.textContent = 'このQRコードは自動的に更新されます。画面を保存せず、その場でレジ端末にかざしてください。';
  countdown.style.display = 'block';

  refreshQrToken();
}

async function refreshQrToken() {
  const box       = document.getElementById('qrBox');
  const note      = document.getElementById('qrNote');
  const countdown = document.getElementById('qrCountdown');

  if (!currentIdToken) return;

  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken: currentIdToken, action: 'issueQrToken' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.success) throw new Error(data.error || '不明なエラー');

    if (typeof QRCode === 'undefined') {
      box.innerHTML = '';
      box.style.display = 'none';
      countdown.style.display = 'none';
      note.textContent = 'QRコードライブラリを読み込めませんでした。通信環境を確認してください。';
      return;
    }

    box.innerHTML = '';
    new QRCode(box, {
      text: data.token,
      width: 200,
      height: 200,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });

    const ttlSeconds = Number(data.expiresInSeconds) || 120;
    qrTokenExpiresAt = Date.now() + ttlSeconds * 1000;
    scheduleQrRefresh(ttlSeconds);
    startQrCountdown();
  } catch (err) {
    note.textContent = 'QRコードの発行に失敗しました: ' + err.message + '（15秒後に再試行します）';
    qrRefreshTimerId = setTimeout(refreshQrToken, 15000);
  }
}

function scheduleQrRefresh(ttlSeconds) {
  clearTimeout(qrRefreshTimerId);
  // 期限が切れる前、余裕を持って次のトークンを取得しておく
  const refreshInMs = Math.max(ttlSeconds * 1000 * 0.75, 5000);
  qrRefreshTimerId = setTimeout(refreshQrToken, refreshInMs);
}

function startQrCountdown() {
  clearInterval(qrCountdownTimerId);
  const countdown = document.getElementById('qrCountdown');
  const tick = () => {
    const remaining = Math.max(0, Math.round((qrTokenExpiresAt - Date.now()) / 1000));
    countdown.textContent = `あと${remaining}秒で更新されます`;
  };
  tick();
  qrCountdownTimerId = setInterval(tick, 1000);
}

function stopQrRefresh() {
  clearTimeout(qrRefreshTimerId);
  clearInterval(qrCountdownTimerId);
  qrRefreshTimerId = null;
  qrCountdownTimerId = null;
}

function hideQr() {
  stopQrRefresh();
  document.getElementById('qrCard').style.display = 'none';
  document.getElementById('qrBox').innerHTML = '';
}

// ── HISTORY ──────────────────────────────────────────────────
let allHistory = [];

async function fetchHistory(idToken) {
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken, action: 'history' }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data.success) {
      allHistory = data.history || [];
      renderHistory(3);
    } else {
      showHistoryError(data.error);
    }
  } catch (err) {
    showHistoryError(err.message);
  }
}

function renderHistory(limit) {
  const section  = document.getElementById('historySection');
  const skel     = document.getElementById('historySkel');
  const list     = document.getElementById('historyList');
  const empty    = document.getElementById('historyEmpty');
  const moreBtn  = document.getElementById('moreBtn');
  const period   = document.getElementById('historyPeriod');

  section.style.display = 'block';
  skel.hidden = true;
  list.innerHTML = '';

  if (allHistory.length === 0) {
    list.hidden = true;
    empty.hidden = false;
    moreBtn.hidden = true;
    period.textContent = '';
    return;
  }

  empty.hidden = true;
  list.hidden = false;

  const items = (limit != null) ? allHistory.slice(0, limit) : allHistory;
  items.forEach(h => list.appendChild(buildHistoryRow(h)));

  // 期間ラベル
  const oldest = new Date(allHistory[allHistory.length - 1].dateTime);
  const newest = new Date(allHistory[0].dateTime);
  period.textContent = `${oldest.getMonth()+1}/${oldest.getDate()} 〜 ${newest.getMonth()+1}/${newest.getDate()}`;

  moreBtn.hidden = (limit == null) || (allHistory.length <= limit);
}

function buildHistoryRow(h) {
  const dt = new Date(h.dateTime);
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${dt.getMonth()+1}/${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}`;

  const isTopup = h.type === 'topup';
  const amountText = isTopup
    ? `+¥${Number(h.amount).toLocaleString()}`
    : `-¥${Number(h.amount).toLocaleString()}`;
  const amountClass = isTopup ? 'history-amount topup' : 'history-amount';

  const row = document.createElement('div');
  row.className = 'history-row';
  row.innerHTML = `
    <div class="history-dot"></div>
    <div class="history-date">${dateStr}</div>
    <div class="history-main">
      <div class="history-name">${escHtml(h.label)}</div>
      <div class="${amountClass}">${amountText}</div>
    </div>`;
  return row;
}

function showAllHistory() {
  renderHistory(null);
}

function showHistoryError(msg) {
  const skel = document.getElementById('historySkel');
  const section = document.getElementById('historySection');
  skel.hidden = true;
  section.style.display = 'block';
  document.getElementById('historyEmpty').hidden = false;
  document.getElementById('historyEmpty').textContent = '履歴の取得に失敗しました: ' + msg;
}

function resetHistory() {
  allHistory = [];
  document.getElementById('historySection').style.display = 'none';
  document.getElementById('historySkel').hidden = false;
  document.getElementById('historyList').hidden = true;
  document.getElementById('historyList').innerHTML = '';
  document.getElementById('historyEmpty').hidden = true;
  document.getElementById('moreBtn').hidden = true;
}

function handleCredentialResponse(response) {
  const idToken = response.credential;
  currentIdToken = idToken;
  signedInEmail = parseEmailFromToken(idToken);
  showBalStatus('残高を確認しています…', 'info');
  fetchBalance(idToken);
  // 履歴・予約状況を並列取得
  document.getElementById('historySection').style.display = 'block';
  fetchHistory(idToken);
  fetchMyReservations();
}

function parseEmailFromToken(token) {
  try {
    const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    return payload.email || '';
  } catch { return ''; }
}

async function fetchBalance(idToken) {
  try {
    const res = await fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ idToken }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    console.log('[UPay] GASレスポンス:', data);
    if (data.success) {
      showBalanceCard(data.balance, signedInEmail, data);
    } else {
      showBalStatus('エラー: ' + (data.error || '不明なエラー'), 'error');
    }
  } catch (err) {
    showBalStatus('通信エラー: ' + err.message, 'error');
  }
}

function handleSignOut() {
  if (typeof google !== 'undefined') {
    google.accounts.id.disableAutoSelect();
    google.accounts.id.revoke(signedInEmail, () => {});
  }
  signedInEmail = null;
  currentIdToken = null;
  hideQr();
  resetHistory();
  myReservationsList = [];
  myReservationsByItemId = {};
  renderMyReservations();
  renderGrid();
  document.getElementById('balanceCard').style.display = 'none';
  document.getElementById('signoutBtn').style.display = 'none';
  document.getElementById('signinCard').style.display = 'block';
  document.getElementById('balStatus').className = '';
}

window.onload = function () {
  if (!GOOGLE_CLIENT_ID || !GAS_WEB_APP_URL) return;
  google.accounts.id.initialize({
    client_id: GOOGLE_CLIENT_ID,
    callback: handleCredentialResponse,
  });
  google.accounts.id.renderButton(
    document.getElementById('signInDiv'),
    { theme: 'outline', size: 'large', text: 'signin_with', locale: 'ja' }
  );
};
</script>
